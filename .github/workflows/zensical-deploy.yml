name: zensical deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Zensical
        run: pip install zensical

      - name: Build site
        run: zensical build --clean

      # Pushes the built site/ into the /fr/ subdirectory of the gh-pages branch
      # on the central deployment repo.
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          # Personal access token with repo write access to the deployment repo
          personal_token: ${{ secrets.DEPLOY_TOKEN }}
          external_repository: Dukestep/zensical-public-doc
          publish_branch: gh-pages
          publish_dir: ./site
          destination_dir: fr
          keep_files: true

      # Publishes the bilingual 404 page at the root of the deployment repo's
      # gh-pages branch. It rewrites legacy "…_en"/"…_fr" URLs to the new
      # "/en/…" and "/fr/…" layout, and otherwise offers both language homes.
      # The EN workflow publishes an identical copy alongside the root landing
      # page; keep_files ensures neither language's build wipes the other out.
      - name: Build 404 page
        run: |
          mkdir -p landing
          cp .github/pages/404.html landing/404.html

      - name: Deploy 404 page
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.DEPLOY_TOKEN }}
          external_repository: Dukestep/zensical-public-doc
          publish_branch: gh-pages
          publish_dir: ./landing
          keep_files: true
